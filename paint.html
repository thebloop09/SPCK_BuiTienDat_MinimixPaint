<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MinimixPaint</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
        :root { --primary: #7d2ae8; --dark: #18191b; --bg: #e9eaed; --side-w: 250px; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { height: 100vh; display: flex; flex-direction: column; background: var(--bg); overflow: hidden; }

        /* Topbar */
        .topbar { height: 60px; background: white; border-bottom: 1px solid #ddd; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 100; }
        .logo { color: var(--primary); font-weight: 800; font-size: 20px; cursor: pointer; }
        
        .config-panel { display: flex; align-items: center; gap: 15px; background: #f1f2f6; padding: 6px 15px; border-radius: 40px; }
        .config-item { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; }
        
        input[type="color"] { border: none; width: 25px; height: 25px; cursor: pointer; background: none; }
        input[type="range"] { cursor: pointer; accent-color: var(--primary); width: 80px; }

        /* Nút Undo hình vuông chuẩn */
        .btn-undo { 
            width: 36px; height: 36px; border-radius: 10px; border: 1px solid #ddd; 
            background: white; cursor: pointer; display: flex; align-items: center; 
            justify-content: center; transition: 0.2s; color: #444; padding: 0;
        }
        .btn-undo:hover { background: var(--primary); color: white; border-color: var(--primary); }

        .btn-main { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 13px; }
        .btn-download { background: #27ae60; color: white; margin-right: 5px; }

        /* Layout */
        .app-body { display: flex; flex: 1; height: calc(100vh - 60px); }
        .sidebar { width: var(--side-w); background: var(--dark); color: white; display: flex; flex-direction: column; padding: 15px; overflow-y: auto; }
        .tool-section h4 { font-size: 10px; color: #666; text-transform: uppercase; margin: 15px 0 8px; letter-spacing: 1px; }
        
        .tool-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tool-btn { background: #2c2c2e; border: none; color: #a9abb0; padding: 12px 5px; border-radius: 10px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 10px; transition: 0.2s; }
        .tool-btn i { font-size: 18px; }
        .tool-btn.active { color: white; background: var(--primary); }

        /* Bảng vẽ */
        .workspace { flex: 1; display: flex; align-items: center; justify-content: center; overflow: auto; padding: 40px; }
        .canvas-holder { position: relative; background: white; box-shadow: 0 15px 50px rgba(0,0,0,0.2); border-radius: 4px; line-height: 0; }
        #mainCanvas { position: absolute; top: 0; left: 0; z-index: 1; border-radius: 4px; }
        #tempCanvas { position: relative; z-index: 2; cursor: crosshair; }
        #textInput { position: absolute; display: none; z-index: 1000; border: 1px dashed var(--primary); background: transparent; outline: none; padding: 3px; font-size: 20px; color: black; }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="logo" onclick="location.href='index.html'">🎨 Minimix<b>Paint</b></div>
        
        <div class="config-panel">
            <div class="config-item"><input type="color" id="colorPicker" value="#000000"></div>
            <div class="config-item">
                <i class="fas fa-pen-nib"></i>
                <input type="range" id="sizeSlider" min="1" max="100" value="5">
                <span id="sizeVal" style="width:20px">5</span>
            </div>
            <div class="config-item">
                <i class="fas fa-droplet"></i>
                <input type="range" id="opacitySlider" min="1" max="100" value="100">
            </div>
            <button class="btn-undo" onclick="undo()" title="Hoàn tác (Ctrl+Z)"><i class="fas fa-rotate-left"></i></button>
        </div>

        <div class="actions">
            <span id="user-display" style="font-size:13px; font-weight:700; color:#555; margin-right:10px;">Họa sĩ</span>
            <button class="btn-main btn-download" onclick="downloadImage()"><i class="fas fa-download"></i> Tải về</button>
            <button class="btn-main" onclick="saveToGalleryBtn()"><i class="fas fa-save"></i> Lưu Gallery</button>
            <button onclick="handleExit()" style="background:none; border:none; color:#ff4757; cursor:pointer; font-weight:700; margin-left:10px;">Thoát</button>
        </div>
    </header>

    <div class="app-body">
        <aside class="sidebar">
            <div class="tool-section">
                <h4>Công cụ vẽ</h4>
                <div class="tool-grid">
                    <button class="tool-btn active" data-tool="brush"><i class="fas fa-paint-brush"></i>Cọ vẽ</button>
                    <button class="tool-btn" data-tool="eraser"><i class="fas fa-eraser"></i>Tẩy</button>
                    <button class="tool-btn" data-tool="fill"><i class="fas fa-fill-drip"></i>Đổ màu</button>
                    <button class="tool-btn" data-tool="picker"><i class="fas fa-eye-dropper"></i>Hút màu</button>
                    <button class="tool-btn" data-tool="text" style="grid-column: span 2;"><i class="fas fa-font"></i>Chèn chữ</button>
                </div>
            </div>

            <div class="tool-section">
                <h4>Hình khối</h4>
                <div class="tool-grid">
                    <button class="tool-btn" data-tool="line"><i class="fas fa-slash"></i>Đường thẳng</button>
                    <button class="tool-btn" data-tool="rect"><i class="far fa-square"></i>Chữ nhật</button>
                    <button class="tool-btn" data-tool="circle"><i class="far fa-circle"></i>Hình tròn</button>
                    <button class="tool-btn" data-tool="poly"><i class="fas fa-draw-polygon"></i>Đa giác</button>
                </div>
            </div>

            <button class="btn-main" onclick="clearCanvas()" style="background:#444; color:#ff4757; margin-top:auto; padding: 15px;"><i class="fas fa-trash-alt"></i> XÓA SẠCH BẢNG</button>
        </aside>

        <main class="workspace">
            <div class="canvas-holder">
                <canvas id="mainCanvas"></canvas>
                <canvas id="tempCanvas"></canvas>
                <input type="text" id="textInput">
            </div>
        </main>
    </div>

    <script>
        const mainCanvas = document.getElementById("mainCanvas");
        const mainCtx = mainCanvas.getContext("2d", { willReadFrequently: true });
        const tempCanvas = document.getElementById("tempCanvas");
        const tempCtx = tempCanvas.getContext("2d");
        const colorPicker = document.getElementById("colorPicker");
        const sizeSlider = document.getElementById("sizeSlider");
        const opacitySlider = document.getElementById("opacitySlider");
        const textInput = document.getElementById("textInput");

        let isDrawing = false, selectedTool = "brush", startX, startY, undoStack = [];
        let polyPoints = []; // Mảng chứa các điểm đa giác

        window.onload = () => {
            const user = localStorage.getItem("currentUser") || "Khách";
            document.getElementById("user-display").innerText = "Họa sĩ: " + user;

            mainCanvas.width = tempCanvas.width = 900;
            mainCanvas.height = tempCanvas.height = 550;
            
            // Khởi tạo bảng sạch
            mainCtx.fillStyle = "white";
            mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            saveState();

            const editing = localStorage.getItem("editingArt");
            if(editing) {
                const img = new Image(); img.src = editing;
                img.onload = () => { mainCtx.drawImage(img, 0, 0); saveState(); localStorage.removeItem("editingArt"); };
            }
        };

        sizeSlider.oninput = () => document.getElementById("sizeVal").innerText = sizeSlider.value;

        // Chuyển đổi công cụ
        document.querySelectorAll(".tool-btn").forEach(btn => {
            btn.onclick = () => {
                if(!btn.dataset.tool) return;
                document.querySelector(".tool-btn.active").classList.remove("active");
                btn.classList.add("active");
                selectedTool = btn.dataset.tool;
                
                // QUAN TRỌNG: Xóa tọa độ đa giác dở dang khi đổi công cụ
                polyPoints = []; 
                tempCtx.clearRect(0,0,tempCanvas.width, tempCanvas.height);
            };
        });

        const setCtx = (c) => {
            c.lineWidth = sizeSlider.value;
            c.strokeStyle = selectedTool === "eraser" ? "white" : colorPicker.value;
            c.fillStyle = colorPicker.value;
            c.globalAlpha = selectedTool === "eraser" ? 1 : opacitySlider.value / 100;
            c.lineCap = "round";
            c.lineJoin = "round";
        };

        tempCanvas.onmousedown = (e) => {
            isDrawing = true;
            startX = e.offsetX; startY = e.offsetY;
            setCtx(mainCtx); setCtx(tempCtx);

            if(selectedTool === "brush" || selectedTool === "eraser") {
                mainCtx.beginPath(); mainCtx.moveTo(startX, startY);
            } else if (selectedTool === "fill") {
                floodFill(startX, startY, colorPicker.value);
                isDrawing = false;
                saveState();
            } else if (selectedTool === "picker") {
                const p = mainCtx.getImageData(startX, startY, 1, 1).data;
                colorPicker.value = "#" + ((1 << 24) + (p[0] << 16) + (p[1] << 8) + p[2]).toString(16).slice(1);
                isDrawing = false;
            } else if (selectedTool === "text") {
                showText(startX, startY);
                isDrawing = false;
            }
        };

        tempCanvas.onmousemove = (e) => {
            if(!isDrawing) return;
            const x = e.offsetX, y = e.offsetY;
            if(selectedTool === "brush" || selectedTool === "eraser") {
                mainCtx.lineTo(x, y); mainCtx.stroke();
            } else {
                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
                if(selectedTool === "line") {
                    tempCtx.beginPath(); tempCtx.moveTo(startX, startY); tempCtx.lineTo(x, y); tempCtx.stroke();
                } else if(selectedTool === "rect") {
                    tempCtx.strokeRect(startX, startY, x - startX, y - startY);
                } else if(selectedTool === "circle") {
                    let r = Math.sqrt(Math.pow(x - startX, 2) + Math.pow(y - startY, 2));
                    tempCtx.beginPath(); tempCtx.arc(startX, startY, r, 0, Math.PI * 2); tempCtx.stroke();
                } else if(selectedTool === "poly" && polyPoints.length > 0) {
                    // Vẽ các cạnh đã xong
                    tempCtx.beginPath();
                    tempCtx.moveTo(polyPoints[0].x, polyPoints[0].y);
                    polyPoints.forEach(p => tempCtx.lineTo(p.x, p.y));
                    // Vẽ cạnh đang kéo chuột
                    tempCtx.lineTo(x, y);
                    tempCtx.stroke();
                }
            }
        };

        tempCanvas.onmouseup = (e) => {
            if(!isDrawing) return;
            
            if(selectedTool === "poly") {
                const x = e.offsetX, y = e.offsetY;
                polyPoints.push({x, y});
                
                // Kiểm tra nếu click gần điểm bắt đầu để đóng đa giác
                if(polyPoints.length > 2) {
                    let dist = Math.sqrt(Math.pow(x - polyPoints[0].x, 2) + Math.pow(y - polyPoints[0].y, 2));
                    if(dist < 20) {
                        mainCtx.beginPath();
                        mainCtx.moveTo(polyPoints[0].x, polyPoints[0].y);
                        polyPoints.forEach(p => mainCtx.lineTo(p.x, p.y));
                        mainCtx.closePath();
                        mainCtx.stroke();
                        
                        polyPoints = []; // Reset đa giác
                        tempCtx.clearRect(0,0,tempCanvas.width, tempCanvas.height);
                        isDrawing = false;
                        saveState();
                        return;
                    }
                }
                return; // Chưa đóng đa giác nên chưa lưu State
            }

            isDrawing = false;
            if(selectedTool !== "brush" && selectedTool !== "eraser") {
                mainCtx.drawImage(tempCanvas, 0, 0);
                tempCtx.clearRect(0, 0, tempCanvas.width, tempCanvas.height);
            }
            saveState();
        };

        function saveState() {
            undoStack.push(mainCtx.getImageData(0, 0, mainCanvas.width, mainCanvas.height));
            if(undoStack.length > 40) undoStack.shift();
        }

        function undo() {
            // Khi nhấn Undo, phải hủy đa giác đang vẽ dở
            polyPoints = []; 
            tempCtx.clearRect(0,0,tempCanvas.width, tempCanvas.height);

            if(undoStack.length > 1) {
                undoStack.pop();
                mainCtx.putImageData(undoStack[undoStack.length - 1], 0, 0);
            } else {
                mainCtx.fillStyle = "white";
                mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
            }
        }

        function clearCanvas() {
            if(confirm("XÓA SẠCH toàn bộ bảng vẽ?")) {
                polyPoints = []; // Xóa tọa độ đa giác
                tempCtx.clearRect(0,0,tempCanvas.width, tempCanvas.height);
                
                const oldAlpha = mainCtx.globalAlpha;
                mainCtx.globalAlpha = 1.0;
                mainCtx.fillStyle = "white";
                mainCtx.fillRect(0, 0, mainCanvas.width, mainCanvas.height);
                mainCtx.globalAlpha = oldAlpha;
                
                saveState();
            }
        }

        function floodFill(x, y, color) {
            const img = mainCtx.getImageData(0, 0, mainCanvas.width, mainCanvas.height);
            const i = (y * img.width + x) * 4;
            const target = [img.data[i], img.data[i+1], img.data[i+2]];
            const fill = [parseInt(color.slice(1,3),16), parseInt(color.slice(3,5),16), parseInt(color.slice(5,7),16)];
            if(target[0]===fill[0] && target[1]===fill[1] && target[2]===fill[2]) return;
            const q = [[x, y]];
            while(q.length) {
                const [cx, cy] = q.pop();
                const idx = (cy * img.width + cx) * 4;
                if(cx>=0 && cx<img.width && cy>=0 && cy<img.height && img.data[idx]===target[0] && img.data[idx+1]===target[1] && img.data[idx+2]===target[2]) {
                    img.data[idx]=fill[0]; img.data[idx+1]=fill[1]; img.data[idx+2]=fill[2]; img.data[idx+3]=255;
                    q.push([cx+1, cy], [cx-1, cy], [cx, cy+1], [cx, cy-1]);
                }
            }
            mainCtx.putImageData(img, 0, 0);
        }

        function showText(x, y) {
            textInput.style.display="block"; textInput.style.left=x+"px"; textInput.style.top=y+"px"; textInput.focus();
            textInput.onkeydown = (e) => {
                if(e.key === "Enter") {
                    mainCtx.font = (sizeSlider.value * 2) + "px Arial";
                    mainCtx.fillText(textInput.value, x, y);
                    textInput.style.display="none"; textInput.value=""; saveState();
                }
            };
        }

        function downloadImage() {
            const link = document.createElement("a");
            link.download = `Minimix_${Date.now()}.png`;
            link.href = mainCanvas.toDataURL();
            link.click();
        }

        function saveToGalleryBtn() {
            let gallery = JSON.parse(localStorage.getItem("paintGallery") || "[]");
            gallery.unshift({ id: Date.now(), user: localStorage.getItem("currentUser"), image: mainCanvas.toDataURL() });
            localStorage.setItem("paintGallery", JSON.stringify(gallery.slice(0, 15)));
            alert("Đã lưu vào Gallery!");
        }

        function handleExit() {
            if(confirm("Lưu tranh trước khi thoát?")) {
                saveToGalleryBtn();
            }
            window.location.href = "index.html";
        }
        
        document.addEventListener('keydown', e => { if(e.ctrlKey && e.key === 'z') undo(); });
    </script>
</body>
</html>
