<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện tranh | Minimix Studio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --primary: #7d2ae8;
            --danger: #ff4757;
            --bg: #f8f9fd;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body { background: var(--bg); padding: 40px 20px; color: #1e1e1e; }

        .container { max-width: 1200px; margin: auto; }

        /* Header Thư viện */
        .gallery-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .gallery-header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        .gallery-header h1 span { color: var(--primary); }

        .btn-back {
            text-decoration: none;
            background: white;
            color: #1e1e1e;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 700;
            border: 1px solid #ddd;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-back:hover { border-color: var(--primary); color: var(--primary); }

        /* Lưới hiển thị tranh */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Thẻ tranh Pro */
        .art-card {
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: 0.3s;
            border: 1px solid rgba(0,0,0,0.02);
            display: flex;
            flex-direction: column;
        }
        .art-card:hover { transform: translateY(-8px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }

        .art-card img {
            width: 100%;
            height: 220px;
            object-fit: contain;
            background: #f1f1f1;
            border-bottom: 1px solid #eee;
        }

        .art-info { padding: 20px; }
        .art-info h3 { font-size: 16px; margin-bottom: 5px; color: #333; }
        .art-info p { font-size: 12px; color: #888; margin-bottom: 15px; }

        /* Nhóm nút bấm dưới thẻ */
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .btn-card {
            padding: 10px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-continue { background: var(--primary); color: white; }
        .btn-continue:hover { background: #6610f2; }

        .btn-delete { background: #fff5f5; color: var(--danger); border: 1px solid #ffebeb; }
        .btn-delete:hover { background: var(--danger); color: white; }

        /* Trạng thái trống */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 100px 0;
            color: #aaa;
        }
        .empty-state i { font-size: 60px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="container">
        <header class="gallery-header">
            <h1>Gallery <span>Paint</span></h1>
            <a href="paint.html" class="btn-back"><i class="fas fa-arrow-left"></i> Quay lại bảng vẽ</a>
        </header>

        <div class="gallery-grid" id="galleryGrid">
            <!-- Tranh sẽ được JS đổ vào đây -->
        </div>
    </div>

    <script>
        // Hàm hiển thị danh sách tranh
        function renderGallery() {
            const grid = document.getElementById("galleryGrid");
            const gallery = JSON.parse(localStorage.getItem("paintGallery") || "[]");
            const user = localStorage.getItem("currentUser");

            // Lọc tranh của đúng người dùng đang đăng nhập
            const myArt = gallery.filter(item => item.user === user);

            if (myArt.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-palette"></i>
                        <h2>Chưa có tác phẩm nào</h2>
                        <p>Hãy quay lại bảng vẽ để tạo bức tranh đầu tiên của bạn!</p>
                    </div>
                `;
                return;
            }

            // Đổ dữ liệu vào giao diện
            grid.innerHTML = myArt.map(item => `
                <div class="art-card">
                    <img src="${item.image}" alt="Minimix Art">
                    <div class="art-info">
                        <h3>Bản vẽ của ${item.user}</h3>
                        <p><i class="far fa-clock"></i> ${item.date}</p>
                        
                        <div class="card-actions">
                            <button class="btn-card btn-continue" onclick="continueDrawing('${item.id}')">
                                <i class="fas fa-edit"></i> Vẽ tiếp
                            </button>
                            <button class="btn-card btn-delete" onclick="deleteArt('${item.id}')">
                                <i class="fas fa-trash-alt"></i> Xóa
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // HÀM XÓA TRANH
        function deleteArt(id) {
            // Hiển thị hộp thoại xác nhận chuyên nghiệp
            if (confirm("Bạn có chắc chắn muốn XÓA VĨNH VIỄN bức tranh này không?")) {
                let gallery = JSON.parse(localStorage.getItem("paintGallery") || "[]");
                
                // Lọc bỏ bức tranh có ID trùng khớp
                gallery = gallery.filter(item => item.id != id);
                
                // Lưu lại mảng mới vào localStorage
                localStorage.setItem("paintGallery", JSON.stringify(gallery));
                
                // Cập nhật lại giao diện ngay lập tức
                renderGallery();
            }
        }

        // Hàm vẽ tiếp
        function continueDrawing(id) {
            const gallery = JSON.parse(localStorage.getItem("paintGallery") || "[]");
            const art = gallery.find(item => item.id == id);
            if (art) {
                localStorage.setItem("editingArt", art.image);
                window.location.href = "paint.html";
            }
        }

        // Chạy khi trang web tải xong
        window.onload = renderGallery;
    </script>
</body>
</html>
