<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký | MinimixPaint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-card">
        <div style="font-size: 40px; margin-bottom: 15px;">✨</div>
        <h2>Tạo tài khoản</h2>
        <p>Bắt đầu hành trình họa sĩ của bạn</p>
        
        <div class="input-group">
            <label>Tên đăng nhập mới</label>
            <input type="text" id="reg-u" placeholder="Ví dụ: hoasi123">
        </div>
        
        <div class="input-group">
            <label>Mật khẩu</label>
            <input type="password" id="reg-p" placeholder="Tối thiểu 6 ký tự">
        </div>
        
        <button class="btn-pro btn-primary" onclick="Auth.register(document.getElementById('reg-u').value, document.getElementById('reg-p').value)">Đăng ký thành viên</button>
        
        <div class="auth-link">
            Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
