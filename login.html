<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập | MinimixPaint</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="full-page">
    <div class="auth-card">
        <div style="font-size: 50px; margin-bottom: 10px;">🎨</div>
        <h2>Chào mừng trở lại!</h2>
        <p class="subtitle">Đăng nhập để bắt đầu thế giới sáng tạo.</p>
        <input type="text" id="login-u" placeholder="Tên đăng nhập">
        <input type="password" id="login-p" placeholder="Mật khẩu">
        <button class="btn-pro btn-primary" style="width: 100%;" onclick="handleLogin()">Vào hệ thống</button>
        <p style="margin-top: 25px; font-size: 14px;">Chưa có tài khoản? <a href="register.html" style="color:var(--primary); font-weight:700; text-decoration:none;">Đăng ký</a></p>
    </div>
    <script src="app.js"></script>
    <script>
        function handleLogin() {
            const u = document.getElementById('login-u').value.trim();
            const p = document.getElementById('login-p').value;
            if(!u || !p) return alert("Vui lòng điền đủ thông tin!");
            Auth.login(u, p);
        }
    </script>
</body>
</html>
