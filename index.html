<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8"><title>MinimixPaint - Chào mừng</title><link rel="stylesheet" href="style.css">
</head>
<body class="hero-container">
    <h1 class="hero-title">Thiết kế mọi thứ với <br><span style="color:var(--primary)">MinimixPaint</span></h1>
    <p class="hero-subtitle">Công cụ vẽ chuyên nghiệp, tinh gọn và mạnh mẽ ngay trên trình duyệt của bạn.</p>
    <div id="cta-group"></div>
    <script src="app.js"></script>
    <script>
        const user = localStorage.getItem('currentUser');
        const cta = document.getElementById('cta-group');
        if(user) {
            cta.innerHTML = `<div class="auth-card">
                <p style="margin-bottom:20px; font-weight:600">Chào mừng trở lại, ${user}!</p>
                <a href="paint.html" class="btn-pro btn-primary">Vào bảng vẽ</a>
                <a href="gallery.html" class="btn-pro btn-outline" style="margin-left:10px">Thư viện</a>
                <button onclick="Auth.logout()" class="btn-pro btn-outline" style="margin-left:10px; color:red; border-color:red">Đăng xuất</button>
            </div>`;
        } else {
            cta.innerHTML = `<a href="login.html" class="btn-pro btn-primary">Đăng nhập ngay</a><a href="register.html" class="btn-pro btn-outline" style="margin-left:10px">Đăng ký thành viên</a>`;
        }
    </script>
</body>
</html>
