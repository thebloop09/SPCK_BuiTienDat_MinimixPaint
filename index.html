<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>MinimixPaint - Chào mừng</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="hero-page">
    <div style="font-size: 60px; margin-bottom: 20px;">🎨</div>
    <h1 class="hero-title">Thiết kế mọi thứ với <br><span>MinimixPaint</span></h1>
    
    <div id="cta-group">
        <!-- JS sẽ tự động đổ nút vào đây -->
    </div>

    <script src="app.js"></script>
    <script>
        // Logic hiển thị nút dựa trên trạng thái đăng nhập
        const user = localStorage.getItem('currentUser');
        const cta = document.getElementById('cta-group');
        
        if(user) {
            cta.innerHTML = `
                <p style="margin-bottom:25px; font-size: 18px;">Chào mừng họa sĩ, <b>${user}</b>!</p>
                <div style="display:flex; gap:15px">
                    <a href="paint.html" class="btn-pro btn-primary" style="width:auto">Vào bảng vẽ</a>
                    <a href="gallery.html" class="btn-pro btn-outline">Thư viện</a>
                    <button onclick="Auth.logout()" class="btn-pro btn-outline" style="color:#ff4757">Đăng xuất</button>
                </div>
            `;
        } else {
            cta.innerHTML = `
                <div style="display:flex; gap:15px">
                    <a href="login.html" class="btn-pro btn-primary" style="width:auto">Đăng nhập ngay</a>
                    <a href="register.html" class="btn-pro btn-outline">Đăng ký thành viên</a>
                </div>
            `;
        }
    </script>
</body>
</html>
